<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Aurikrex CBT Logo">
  <defs>
    <linearGradient id="cbt-blue-ring" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="45%" stop-color="#0084ff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>
  </defs>
  <!-- Dark Circular Background -->
  <circle cx="50" cy="50" r="49" fill="#07101e"/>
  <!-- Outer Slate Ring -->
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="#1f2c42" stroke-width="3"/>
  <!-- Glowing Cyan/Blue Concentric Ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#cbt-blue-ring)" stroke-width="12"/>
  <!-- Inner Dark Island -->
  <circle cx="50" cy="50" r="28" fill="#07101e"/>
  <!-- Upper-Left Interlocking Rounded Bracket -->
  <path d="M54 41 H38 A 4 4 0 0 0 34 45 V56" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower-Right Interlocking Rounded Bracket -->
  <path d="M46 59 H62 A 4 4 0 0 0 66 55 V44" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>